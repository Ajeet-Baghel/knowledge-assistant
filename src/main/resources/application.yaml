spring:
  application:
    name: knowledge-assistant
  datasource:
    url: ${KA_DB_URL:jdbc:postgresql://localhost:5432/knowledge_assistant}
    username: ${KA_DB_USERNAME:postgres}
    password: ${KA_DB_PASSWORD:PostgreSQL@2026}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
file:
  upload-dir: D:/knowledge-assistant-filedata