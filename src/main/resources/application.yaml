spring:
  application:
    name: knowledge-assistant
  datasource:
    url: ${KA_DB_URL:jdbc:postgresql://localhost:5432/knowledge_assistant}
    username: ${KA_DB_USERNAME:postgres}
    password: ${KA_DB_PASSWORD:PostgreSQL@2026}
    jpa:
      hibernate:
        ddl-auto: none
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PosgreSQLDialect